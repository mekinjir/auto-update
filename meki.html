<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AM Preset Finder</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root{--bg-base:#0a0a0f;--bg-panel:#12121a;--bg-box:#1a1a24;--neon:#00d2ff;--neon-glow:rgba(0,210,255,.3);--text:#fff;--text-muted:#8e8e9e;--border:#2a2a35;--success:#00ff9d;--danger:#ff3366;--warn:#ffcc00}*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}body{background-color:var(--bg-base);color:var(--text);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
        @keyframes spin{100%{transform:rotate(360deg)}}@keyframes pulse{0%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:.8}100%{transform:scale(1);opacity:1}}@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-4px)}100%{transform:translateY(0)}}@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(10deg)}75%{transform:rotate(-10deg)}}@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .icon-spin{animation:spin 4s linear infinite}.icon-pulse{animation:pulse 2s ease-in-out infinite}.icon-float{animation:float 3s ease-in-out infinite}.sidebar a:hover i,.contact-item:hover i,.btn:hover i,.menu-btn:hover i,.chat-input-area label:hover i{animation:shake .4s ease-in-out infinite}
        .navbar{width:100%;height:60px;background:var(--bg-panel);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;padding:0 20px;position:fixed;top:0;z-index:100}.logo{font-size:1.2rem;font-weight:800;letter-spacing:1px;color:var(--neon);text-shadow:0 0 10px var(--neon-glow);display:flex;align-items:center;gap:8px;cursor:pointer}.logo i{font-size:1.3rem}.menu-btn{background:transparent;border:none;color:var(--text);font-size:1.5rem;cursor:pointer;padding:5px;transition:.3s}.menu-btn:hover{color:var(--neon)}
        .sidebar{position:fixed;top:60px;right:-300px;width:260px;height:calc(100vh - 60px);background:var(--bg-panel);border-left:1px solid var(--border);transition:.4s cubic-bezier(.4,0,.2,1);padding:20px;z-index:99;box-shadow:-10px 0 30px rgba(0,0,0,.5);overflow-y:auto}.sidebar.open{right:0}.sidebar a{display:flex;align-items:center;gap:12px;color:var(--text-muted);text-decoration:none;padding:15px;border-radius:8px;margin-bottom:5px;transition:.3s;font-size:.9rem;font-weight:500;cursor:pointer}.sidebar a i{font-size:1.2rem}.sidebar a:hover,.sidebar a.active{background:rgba(0,210,255,.05);color:var(--neon);border-left:3px solid var(--neon)}
        .main-content{margin-top:60px;padding:20px 15px;display:flex;justify-content:center;flex:1;width:100%}.wrapper{width:100%;max-width:800px}.page-section{display:none;animation:fadeIn .3s ease}.page-section.active{display:block}
        .input-group{display:flex;gap:10px;margin-bottom:25px}.input-wrapper{flex:1;position:relative;display:flex;align-items:center}.input-wrapper i.fa-link{position:absolute;left:15px;color:var(--text-muted)}.input-wrapper input{width:100%;background:var(--bg-panel);border:1px solid var(--border);padding:15px 45px 15px 40px;border-radius:8px;color:var(--text);font-size:.9rem;outline:none;transition:.3s}.input-wrapper input:focus{border-color:var(--neon);box-shadow:0 0 10px rgba(0,210,255,.1)}.clear-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.1);border:none;color:var(--text);font-size:.8rem;cursor:pointer;display:none;width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;transition:all .2s}.clear-btn:hover{background:var(--danger);color:#fff}.btn-search{background:var(--neon);color:#000;border:1px solid var(--neon);padding:0 25px;border-radius:8px;font-weight:700;font-size:.9rem;cursor:pointer;transition:.3s;display:flex;align-items:center;justify-content:center;gap:8px}.btn-search:hover{box-shadow:0 0 15px var(--neon-glow)}
        #console-box{display:none;background:#000;border:1px solid var(--border);border-radius:8px;padding:15px;font-family:'Fira Code',monospace;font-size:.8rem;color:var(--neon);height:150px;overflow-y:auto;margin-bottom:20px;box-shadow:inset 0 0 10px rgba(0,210,255,.05)}.log-line{margin-bottom:6px;animation:fadeIn .2s}.log-time{color:#555;margin-right:8px}.log-success{color:var(--success)}.log-error{color:var(--danger)}.log-warn{color:var(--warn)}
        #result-area { display: none; }
        .video-detail{text-align:center;margin-bottom:25px}.video-preview{width:180px;height:240px;object-fit:contain;background:#000;border-radius:12px;margin:0 auto 10px auto;display:block;box-shadow:0 5px 15px rgba(0,0,0,.5);border:1px solid var(--border);pointer-events:none}.btn-unmute{background:var(--bg-box);color:var(--text);border:1px solid var(--border);padding:8px 15px;border-radius:6px;font-size:.8rem;cursor:pointer;margin-bottom:15px;display:inline-flex;align-items:center;gap:8px;transition:.2s}.btn-unmute:hover{border-color:var(--neon);color:var(--neon)}.video-caption{font-size:.9rem;font-weight:500;margin-bottom:15px;text-align:left;line-height:1.4}.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;text-align:left;margin-bottom:20px}.stat-box span{display:block;font-size:.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}.stat-box strong{font-size:.95rem;font-weight:600;color:var(--text)}.preset-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding-bottom:10px;border-bottom:1px dashed var(--border)}.preset-header h3{font-size:1.1rem;font-weight:700}.preset-count{background:rgba(0,210,255,.1);color:var(--neon);border:1px solid rgba(0,210,255,.3);padding:2px 8px;border-radius:6px;font-size:.8rem;font-weight:700}
        
        .preset-card{background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;padding:15px;margin-bottom:15px;transition:.3s;display:flex;flex-direction:column;gap:12px}
        .preset-card:hover{border-color:rgba(0,210,255,.3);box-shadow:0 0 15px rgba(0,210,255,.05)}
        .card-content{display:flex; gap:15px;}
        .preset-img{width:80px; height:110px; object-fit:cover; border-radius:8px; border:1px solid var(--border); flex-shrink:0; background:#000;}
        .card-meta{flex:1; display:flex; flex-direction:column; justify-content:center;}
        .card-meta h4{font-size:1rem;margin-bottom:5px;font-weight:600; display:flex; flex-wrap:wrap; align-items:center; gap:5px;}
        .tags{display:flex;align-items:center;gap:8px;margin-bottom:8px}
        .tag-xml{background:rgba(0,210,255,.1);color:var(--neon);padding:2px 8px;border-radius:4px;font-size:.7rem;font-weight:700}
        .tag-size{font-size:.75rem;color:var(--text-muted)}
        .card-meta p{font-size:.8rem;color:var(--text-muted)}
        .link-box{background:#000;border:1px solid var(--border);padding:12px;border-radius:8px;font-family:'Fira Code',monospace;font-size:.75rem;color:var(--text-muted);word-break:break-all;line-height:1.5;width:100%;}
        
        .action-buttons{display:flex;gap:10px; width:100%;}.btn{flex:1;padding:10px;border-radius:6px;font-size:.8rem;font-weight:600;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px;text-decoration:none;transition:.2s}.btn-copy{background:var(--bg-box);color:var(--text);border:1px solid var(--border)}.btn-copy:hover{border-color:var(--neon)}.btn-copy.copied{background:rgba(0,210,255,.1);color:var(--neon);border-color:var(--neon)}.btn-open{background:var(--neon);color:#000;border:1px solid var(--neon)}.btn-open:hover{box-shadow:0 0 10px var(--neon-glow)}
        
        /* CHAT GLOBAL */
        .chat-container{display:flex;flex-direction:column;height:calc(100vh - 180px);min-height:400px;background:var(--bg-panel);border-radius:12px;border:1px solid var(--border);overflow:hidden;padding-bottom:70px;}
        .chat-messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px;}
        
        .chat-bubble{background:var(--bg-box);padding:10px 15px;border-radius:12px 12px 12px 0;max-width:80%;word-wrap:break-word;align-self:flex-start;border:1px solid var(--border);position:relative;transition: background 0.2s; user-select: none; -webkit-user-select: none;}
        .chat-bubble.own{background:rgba(0,210,255,.1);color:var(--neon);align-self:flex-end;border-radius:12px 12px 0 12px;border-color:rgba(0,210,255,.3);}
        .chat-bubble:active { background: rgba(255,255,255,0.1); }
        .chat-bubble img{max-width:100%;border-radius:8px;margin-top:8px; pointer-events: none;}
        .chat-bubble .sender{font-size:.65rem;color:var(--text-muted);margin-bottom:4px;display:block;font-weight:bold;}
        
        .chat-input-area{display:flex;gap:10px;padding:10px;border-top:1px solid var(--border);background:var(--bg-base);align-items:center;}
        .chat-input-area input[type="text"]{flex:1;padding:12px;border-radius:8px;border:1px solid var(--border);background:var(--bg-panel);color:#fff;outline:none;}
        .chat-input-area input[type="text"]:focus{border-color:var(--neon);}
        .chat-input-area label{background:var(--bg-box);border:1px solid var(--border);padding:10px 12px;border-radius:8px;cursor:pointer;color:var(--text-muted);transition:.2s;}
        .chat-input-area label:hover{border-color:var(--neon);color:var(--neon);}
        .chat-input-area button{background:var(--neon);color:#000;border:none;padding:12px 15px;border-radius:8px;cursor:pointer;font-weight:700;}
        
        /* AI FAB */
        .ai-fab{position:fixed;bottom:80px;right:20px;width:60px;height:60px;border-radius:50%;background:var(--neon);color:#000;display:flex;justify-content:center;align-items:center;font-size:1.5rem;box-shadow:0 4px 15px var(--neon-glow);cursor:pointer;z-index:9998;transition:transform .3s ease}
        .ai-fab:hover{transform:scale(1.1);box-shadow:0 0 25px var(--neon)}
        .ai-chat-window{position:fixed;bottom:150px;right:20px;width:350px;height:500px;background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.5);z-index:9998;display:none;flex-direction:column;overflow:hidden;animation:slideUp .3s ease}
        .ai-chat-window.active{display:flex}
        .ai-chat-header{background:var(--bg-box);padding:15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);color:var(--neon);font-weight:bold}
        .ai-chat-header .close-ai{background:transparent;border:none;color:var(--text-muted);font-size:1.2rem;cursor:pointer}
        .ai-chat-header .close-ai:hover{color:var(--danger)}
        .ai-chat-window .chat-container{height:calc(100% - 55px);border:none;border-radius:0;padding-bottom:0;}
        
        /* CUSTOM MODAL POPUP */
        .custom-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:99999;display:none;justify-content:center;align-items:center;backdrop-filter:blur(4px);}
        .custom-modal.active{display:flex;}
        .custom-modal-content{background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;padding:25px;width:90%;max-width:350px;text-align:center;animation:slideUp .3s ease;box-shadow:0 10px 30px rgba(0,0,0,0.8);}
        .custom-modal-content h3{color:var(--text);margin-bottom:10px;font-size:1.2rem;}
        .custom-modal-content p{color:var(--text-muted);font-size:.9rem;margin-bottom:20px;}
        .custom-modal-actions{display:flex;gap:10px;}
        .custom-modal-actions button{flex:1;padding:12px;border-radius:8px;font-weight:700;cursor:pointer;border:none;transition:.2s;}
        .btn-modal-cancel{background:var(--bg-box);color:var(--text);border:1px solid var(--border) !important;}
        .btn-modal-cancel:hover{background:var(--border);}
        .btn-modal-confirm{background:var(--danger);color:#fff;}
        .btn-modal-confirm:hover{box-shadow:0 0 15px rgba(255,51,102,0.5);}

        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,10,15,0.95);z-index:99998;display:none;justify-content:center;align-items:center;padding:20px;backdrop-filter:blur(5px);}
        .modal-content{background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;padding:30px;max-width:400px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.8);}
        .modal-content h2{color:var(--neon);margin-bottom:10px;}
        .modal-content p{color:var(--text-muted);font-size:0.9rem;margin-bottom:20px;}
        .modal-content input{width:100%;padding:15px;border-radius:8px;border:1px solid var(--border);background:var(--bg-base);color:var(--text);font-size:1rem;outline:none;margin-bottom:15px;text-align:center;}
        .modal-content input:focus{border-color:var(--neon);}
        .modal-content button{width:100%;padding:15px;border-radius:8px;background:var(--neon);color:#000;border:none;font-weight:700;font-size:1rem;cursor:pointer;transition:.3s;}
        .modal-content button:hover{box-shadow:0 0 15px var(--neon-glow);}
        .modal-content .error-msg{color:var(--danger);font-size:0.8rem;margin-bottom:10px;display:none;}
        .contact-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:20px}.contact-item{background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:15px;display:flex;align-items:center;gap:15px;text-decoration:none;color:var(--text);transition:.3s}.contact-item:hover{border-color:var(--neon);box-shadow:0 0 10px rgba(0,210,255,.1)}.contact-icon{width:45px;height:45px;background:rgba(0,210,255,.1);color:var(--neon);display:flex;justify-content:center;align-items:center;border-radius:8px;font-size:1.2rem}.contact-info span{display:block;font-size:.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}.contact-info strong{font-family:'Fira Code',monospace;font-size:.9rem}
        .toast-container{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none;width:90%;max-width:350px}.toast{background:var(--bg-box);border:1px solid var(--border);border-left:4px solid var(--neon);padding:12px 20px;border-radius:8px;color:var(--text);font-size:.85rem;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.8);display:flex;align-items:center;gap:10px;transform:translateY(20px);opacity:0;transition:all .4s}.toast.show{transform:translateY(0);opacity:1}.toast-error{border-left-color:var(--danger)}.toast-error i{color:var(--danger)}.toast-success{border-left-color:var(--success)}.toast-success i{color:var(--success)}@keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @media(min-width:600px){.contact-grid{grid-template-columns:repeat(2,1fr)}}
        @media(max-width:600px){.ai-chat-window{width:calc(100% - 40px);right:20px;left:20px;bottom:150px;}}
    </style>
</head>
<body>

    <div id="app"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        // GANTI CONFIG FIREBASE DI SINI
        const firebaseConfig = {
            apiKey: "AIzaSyBaLh_Q5brZAnj3I8-IUABK8bpmoTG0HJk",
            authDomain: "am-finder-71071.firebaseapp.com",
            projectId: "am-finder-71071",
            storageBucket: "am-finder-71071.firebasestorage.app",
            messagingSenderId: "135057336538",
            appId: "1:135057336538:web:ca04ae3590ed81bd959de3",
            measurementId: "G-BPTQJND0LS"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const DEV_USERNAME = "Mekinjir";
        let hasClickedWA = localStorage.getItem('hasClickedWA') === 'true';
        let isVerified = localStorage.getItem('isVerified') === 'true';
        let abortController = null;
        let username = localStorage.getItem('username') || '';
        let isDev = localStorage.getItem('isDev') === 'true';
        
        const delay = ms => new Promise(res => setTimeout(res, ms));

        // ==========================================
        // FITUR PEMBERSIH LINK (REGEX SAKTI)
        // ==========================================
        window.ekstrakLinkCerdas = function(teks) {
            if (!teks) return [];
            let links = [];
            
            // Bersihin karakter aneh (emoji/non-ASCII) biar gak ngerusak regex
            let cleanedTeks = teks.replace(/[^\x20-\x7E\s]/g, ''); 
            
            // Regex nyari link yang ada embel-embel domain target
            let urlRegex = /(?:https?:\/\/)?(?:[a-zA-Z0-9-]+\.)*(?:alightcreative\.com|drive\.google\.com|mediafire\.com|alight\.link)[^\s]*/gi;
            
            let matches = cleanedTeks.match(urlRegex);
            
            if (matches) {
                matches.forEach(w => {
                    let clean = w;
                    
                    // Benerin slash yang kurang atau kelebihan
                    clean = clean.replace(/https?:\/*/gi, 'https://');
                    
                    // Kalau gak ada http di depan, tambahin
                    if (!clean.startsWith('http')) {
                        clean = 'https://' + clean;
                    }
                    
                    // Buang tanda baca di akhir link
                    clean = clean.replace(/[.,!?\]\)>]$/, '');
                    
                    links.push(clean);
                });
            }
            return [...new Set(links)];
        };

        // ==========================================
        // FITUR AMBIL GAMBAR DARI GOOGLE DRIVE
        // ==========================================
        window.getDriveThumbnail = function(url) {
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w300`;
            }
            return null;
        };

        window.printLog = function(message, type = 'normal') {
            const consoleBox = document.getElementById('console-box');
            if(!consoleBox) return;
            const time = new Date().toLocaleTimeString('id-ID', { hour12: false });
            let colorClass = '';
            if (type === 'success') colorClass = 'log-success';
            if (type === 'error') colorClass = 'log-error';
            if (type === 'warn') colorClass = 'log-warn';
            const div = document.createElement('div');
            div.className = 'log-line';
            div.innerHTML = `<span class="log-time">[${time}]</span> <span class="${colorClass}">${message}</span>`;
            consoleBox.appendChild(div);
            consoleBox.scrollTop = consoleBox.scrollHeight;
        };

        window.toggleClearBtn = function(inputId, btnId) {
            const input = document.getElementById(inputId);
            const btn = document.getElementById(btnId);
            if (input.value.trim().length > 0) { btn.style.display = 'flex'; } else { btn.style.display = 'none'; }
        };

        window.clearSearch = function(type) {
            if (abortController) abortController.abort();
            if (type === 'preset') {
                document.getElementById('ttLink').value = '';
                document.getElementById('clearPreset').style.display = 'none';
                document.getElementById('result-area').style.display = 'none';
                document.getElementById('console-box').style.display = 'none';
                const vid = document.getElementById('vidPreview'); vid.pause(); vid.removeAttribute('src'); vid.load();
                document.getElementById('btnSearch').innerHTML = '<i class="fa-solid fa-play"></i> Cari';
                document.getElementById('btnSearch').disabled = false;
            } else if (type === 'download') {
                document.getElementById('dlLink').value = '';
                document.getElementById('clearDownload').style.display = 'none';
                document.getElementById('dl-result-area').style.display = 'none';
                document.getElementById('btnDl').innerHTML = '<i class="fa-solid fa-download"></i> Ambil';
                document.getElementById('btnDl').disabled = false;
            }
        };

        window.showToast = function(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            let icon = '<i class="fa-solid fa-circle-info"></i>';
            if (type === 'success') icon = '<i class="fa-solid fa-circle-check icon-pulse"></i>';
            if (type === 'error') icon = '<i class="fa-solid fa-circle-xmark"></i>';
            toast.innerHTML = `${icon} <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 3000);
        };

        // ==========================================
        // FITUR SALIN LINK (ANTI GAGAL)
        // ==========================================
        window.salinLink = function(btn, url) {
            if (!url || url === '#') return window.showToast("Link tidak valid!", "error");

            const ubahTombol = (button) => {
                const originalHTML = button.innerHTML;
                button.innerHTML = '<i class="fa-solid fa-check icon-pulse"></i> Tersalin';
                button.classList.add('copied');
                window.showToast("Link berhasil disalin!", "success");
                setTimeout(() => {
                    button.innerHTML = originalHTML;
                    button.classList.remove('copied');
                }, 2000);
            };

            const fallbackCopy = (text) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.opacity = "0";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    const successful = document.execCommand('copy');
                    if (successful) {
                        ubahTombol(btn);
                    } else {
                        window.showToast("Gagal menyalin, coba manual.", "error");
                    }
                } catch (err) {
                    window.showToast("Gagal menyalin: " + err, "error");
                }
                document.body.removeChild(textArea);
            };

            // Cek apakah browser mendukung clipboard API modern & di HTTPS
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(url).then(() => {
                    ubahTombol(btn);
                }).catch(err => {
                    fallbackCopy(url);
                });
            } else {
                // Fallback buat ZArchiver / HTTP / browser jadul
                fallbackCopy(url);
            }
        };

        let customModalCallback = null;
        window.showCustomModal = function(title, message, btnConfirmText, btnConfirmColor, callback) {
            document.getElementById('customModalTitle').innerText = title;
            document.getElementById('customModalMsg').innerText = message;
            const btnConfirm = document.getElementById('customModalBtnConfirm');
            btnConfirm.innerText = btnConfirmText;
            btnConfirm.style.background = btnConfirmColor;
            customModalCallback = callback;
            document.getElementById('customModal').classList.add('active');
        };
        window.closeCustomModal = function() {
            document.getElementById('customModal').classList.remove('active');
